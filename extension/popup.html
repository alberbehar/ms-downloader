<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MS Downloader</title>
  <style>
    body { margin: 0; width: 300px; font: 13px/1.5 "Segoe UI", system-ui, sans-serif; color: #0f172a; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #1d4ed8; color: #fff; }
    header img { width: 28px; height: 28px; }
    header h1 { margin: 0; font-size: 15px; }
    header small { opacity: .8; }
    main { padding: 12px 16px 16px; }
    ol { margin: 0 0 12px; padding-left: 18px; }
    li { margin-bottom: 6px; }
    .sites { background: #f1f5f9; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #334155; }
    a { color: #1d4ed8; }
    footer { margin-top: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div>
      <h1>MS Downloader</h1>
      <small id="version"></small>
    </div>
  </header>
  <main>
    <ol>
      <li>Open a meeting recording in Teams, SharePoint or Stream.</li>
      <li>Click the blue <b>Transcript</b> button in the bottom-right corner.</li>
      <li>Pick a format and press <b>Download</b>.</li>
    </ol>
    <div class="sites">Works on <b>*.sharepoint.com</b> pages and recordings opened inside Teams.</div>
    <footer><a href="https://github.com/alberbehar/ms-downloader" target="_blank" rel="noopener">GitHub</a></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
