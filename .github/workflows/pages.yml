# Publishes site/ to https://alberbehar.github.io/ms-downloader/
# together with a fresh MS-Downloader.zip built from extension/.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site and extension ZIP
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r extension MS-Downloader
          zip -rq _site/MS-Downloader.zip MS-Downloader
          VERSION=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          sed -i "s/2\.1\.0/$VERSION/g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
